<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <!-- Lichtstudie „Stallgasse am Morgen“, Schwarz-Weiß (Platzhalter für ein Foto,
       selbst gezeichnet, keine fremden Bilder). Zentralperspektive: Boxenwände
       links und rechts laufen auf das helle, offene Tor am Ende der Gasse zu. -->
  <defs>
    <linearGradient id="decke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1a19"/>
      <stop offset="1" stop-color="#4a4643"/>
    </linearGradient>
    <linearGradient id="boden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8983"/>
      <stop offset="1" stop-color="#2a2725"/>
    </linearGradient>
    <linearGradient id="wandL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d2a28"/>
      <stop offset="1" stop-color="#77716b"/>
    </linearGradient>
    <linearGradient id="wandR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#262321"/>
      <stop offset="1" stop-color="#6e6862"/>
    </linearGradient>
    <filter id="glanz" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="weich" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Raum: Decke, Boden, Seitenwände (Fluchtpunkt bei 200/230) -->
  <rect width="400" height="500" fill="url(#decke)"/>
  <polygon points="0,500 165,285 235,285 400,500" fill="url(#boden)"/>
  <polygon points="0,40 165,175 165,285 0,500" fill="url(#wandL)"/>
  <polygon points="400,40 235,175 235,285 400,500" fill="url(#wandR)"/>

  <!-- Deckenbalken -->
  <g stroke="#0f0e0d" stroke-width="3" opacity=".8">
    <line x1="30" y1="65" x2="370" y2="65"/>
    <line x1="70" y1="97" x2="330" y2="97"/>
    <line x1="105" y1="126" x2="295" y2="126"/>
    <line x1="135" y1="150" x2="265" y2="150"/>
    <line x1="155" y1="167" x2="245" y2="167"/>
  </g>

  <!-- Boxentüren: senkrechte Kanten, perspektivisch enger werdend -->
  <g stroke="#1a1817" stroke-width="2" opacity=".75">
    <line x1="30" y1="65" x2="30" y2="461"/>
    <line x1="70" y1="97" x2="70" y2="409"/>
    <line x1="105" y1="126" x2="105" y2="364"/>
    <line x1="135" y1="150" x2="135" y2="324"/>
    <line x1="155" y1="167" x2="155" y2="298"/>
    <line x1="370" y1="65" x2="370" y2="461"/>
    <line x1="330" y1="97" x2="330" y2="409"/>
    <line x1="295" y1="126" x2="295" y2="364"/>
    <line x1="265" y1="150" x2="265" y2="324"/>
    <line x1="245" y1="167" x2="245" y2="298"/>
  </g>
  <!-- Gitter-Oberkante der Boxen (Linie auf halber Höhe der Wand) -->
  <g stroke="#a29b94" stroke-width="1.2" opacity=".5">
    <line x1="0" y1="250" x2="165" y2="225"/>
    <line x1="400" y1="250" x2="235" y2="225"/>
  </g>

  <!-- Offenes Tor am Ende: Morgenlicht -->
  <rect x="165" y="175" width="70" height="110" fill="#f3efe8"/>
  <ellipse cx="200" cy="232" rx="70" ry="85" fill="#f3efe8" opacity=".35" filter="url(#glanz)"/>

  <!-- Lichtbahn auf dem Boden (Stallgasse glänzt nass im Gegenlicht) -->
  <polygon points="168,285 232,285 300,500 100,500" fill="#e6e1da" opacity=".35" filter="url(#weich)"/>
  <polygon points="190,285 210,285 230,500 170,500" fill="#ffffff" opacity=".18" filter="url(#weich)"/>
</svg>
