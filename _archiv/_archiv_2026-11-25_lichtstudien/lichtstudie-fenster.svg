<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <!-- Lichtstudie „Fensterlicht“ (Platzhalter für ein Foto, selbst gezeichnet, keine fremden Bilder)
       Motiv: Fensterlicht fällt schräg auf eine Stallwand, an einem Haken hängt
       eine Trense mit Zügeln im Streiflicht. Farben: Atelier A (Blush, Oxblood, Ink). -->
  <defs>
    <linearGradient id="wand" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#6e4b45"/>
      <stop offset="0.65" stop-color="#4a302d"/>
      <stop offset="1" stop-color="#2c1d1c"/>
    </linearGradient>
    <linearGradient id="licht" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3d8"/>
      <stop offset="1" stop-color="#e9c9c0"/>
    </linearGradient>
    <linearGradient id="boden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3c36"/>
      <stop offset="1" stop-color="#241817"/>
    </linearGradient>
    <filter id="weich" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="sehrweich" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="schatten" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Wand und Bodenkante -->
  <rect width="400" height="500" fill="url(#wand)"/>
  <rect y="432" width="400" height="68" fill="url(#boden)"/>
  <rect y="430" width="400" height="3" fill="#7a564d" opacity=".6"/>

  <!-- Lichtschacht von oben links (Staub in der Luft) -->
  <polygon points="-40,-20 110,-20 368,330 186,372" fill="#f3dccd" opacity=".12" filter="url(#sehrweich)"/>

  <!-- Fensterfleck auf der Wand mit Sprossen-Schatten -->
  <g filter="url(#weich)">
    <polygon points="180,95 355,70 365,330 190,365" fill="url(#licht)" opacity=".92"/>
    <polygon points="263,84 272,83 282,348 273,349" fill="#4a302d" opacity=".85"/>
    <polygon points="185,226 360,196 361,205 186,235" fill="#4a302d" opacity=".85"/>
  </g>
  <!-- Licht läuft auf dem Boden aus -->
  <polygon points="150,432 330,432 400,500 170,500" fill="#e9c9c0" opacity=".18" filter="url(#sehrweich)"/>

  <!-- Schatten von Trense und Zügeln (nach rechts unten versetzt) -->
  <g transform="translate(16 8)" fill="none" stroke="#2b1b19" stroke-linecap="round" opacity=".45" filter="url(#schatten)">
    <path d="M236 150 C 214 230 214 300 236 334 C 258 300 258 230 236 150" stroke-width="6"/>
    <path d="M238 152 C 252 250 268 330 258 424" stroke-width="5"/>
  </g>

  <!-- Haken -->
  <circle cx="236" cy="146" r="5" fill="#2b1b19"/>
  <circle cx="235" cy="145" r="1.6" fill="#b08a7c"/>

  <!-- Trense: Lederschlaufe mit Kante im Streiflicht -->
  <g fill="none" stroke-linecap="round">
    <path d="M236 150 C 214 230 214 300 236 334 C 258 300 258 230 236 150" stroke="#2b1b19" stroke-width="6"/>
    <path d="M233 158 C 214 232 215 296 234 328" stroke="#9a6a5c" stroke-width="1.2" opacity=".8"/>
    <!-- Gebiss (Metallring) -->
    <circle cx="236" cy="338" r="9" stroke="#3a2a27" stroke-width="3"/>
    <path d="M230 333 A 9 9 0 0 1 242 333" stroke="#e9d6cc" stroke-width="1.2" opacity=".9"/>
    <!-- Zügel -->
    <path d="M238 152 C 252 250 268 330 258 424" stroke="#2b1b19" stroke-width="5"/>
    <path d="M241 160 C 254 250 268 326 260 410" stroke="#9a6a5c" stroke-width="1" opacity=".7"/>
  </g>
  <!-- Schnalle -->
  <rect x="249" y="268" width="12" height="9" rx="1.5" fill="none" stroke="#d9c2b6" stroke-width="1.6" transform="rotate(-8 255 272)"/>
</svg>
